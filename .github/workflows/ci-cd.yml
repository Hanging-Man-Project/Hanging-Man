name: CI/CD Hangman Docker Stack

# Trigger on any push or PR
on:
  push:
    branches:
      - '**'  # All branches
  pull_request:
    branches:
      - '**'

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    env:
      BRANCH_NAME: ${{ github.ref_name }}

    steps:
      # ----------------------------------------------------
      # 1. Checkout repository
      # ----------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v3


      # ----------------------------------------------------
      # 3. Build Docker images (all branches)
      # ----------------------------------------------------
      - name: Build Docker images
        run: |
          docker compose build

      # ----------------------------------------------------
      # 4. Integration tests (dev & prod only)
      # ----------------------------------------------------
      - name: Run full-stack integration tests
        if: startsWith(env.BRANCH_NAME, 'dev') || env.BRANCH_NAME == 'prod'
        run: |
          docker compose -f docker-compose.yml up -d
          sleep 30

          echo "Check proxy availability..."
          curl -f http://localhost:8080/

          echo "Check API health..."
          curl -f http://localhost:8080/health

          echo "Start a new Hangman game..."
          curl -X POST http://localhost:8080/new_game

          echo "Send a letter guess..."
          curl -X POST http://localhost:8080/guess \
            -H "Content-Type: application/json" \
            -d '{"letter":"a"}'

      # ----------------------------------------------------
      # 5. Show logs on failure (dev & prod only)
      # ----------------------------------------------------
      - name: Show Docker logs if tests fail
        if: failure() && (startsWith(env.BRANCH_NAME, 'dev') || env.BRANCH_NAME == 'prod')
        run: docker compose logs

      # ----------------------------------------------------
      # 6. Cleanup Docker environment (always)
      # ----------------------------------------------------
      - name: Cleanup Docker
        if: always()
        run: docker compose down -v

      # ----------------------------------------------------
      # 7. Login to Docker Hub (prod only)
      # ----------------------------------------------------
      - name: Docker Hub Login
        if: env.BRANCH_NAME == 'prod'
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      # ----------------------------------------------------
      # 8. Build & Push Docker images (prod only)
      # ----------------------------------------------------
      - name: Build & Push API image
        if: env.BRANCH_NAME == 'prod'
        uses: docker/build-push-action@v5
        with:
          context: ./api
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/api:${{ github.sha }}

      - name: Build & Push Worker image
        if: env.BRANCH_NAME == 'prod'
        uses: docker/build-push-action@v5
        with:
          context: ./worker
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/worker:${{ github.sha }}

      - name: Build & Push Proxy image
        if: env.BRANCH_NAME == 'prod'
        uses: docker/build-push-action@v5
        with:
          context: ./proxy
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/proxy:${{ github.sha }}
